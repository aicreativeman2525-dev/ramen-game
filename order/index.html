<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="発注"><title>ぷちグループ 発注ツール</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:14px 12px 110px}h1{font-size:23px;margin:4px 0 16px}label{font-weight:700;font-size:13px;display:block;margin-bottom:6px}input[type=date],input[type=search]{width:100%;font-size:16px;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff}.top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}button{touch-action:manipulation}.reset,.sub{min-height:46px;padding:0 14px;border:1px solid #ddd;background:#fff;border-radius:12px;font-weight:700}.search{margin-top:12px}.sticky{position:sticky;top:0;z-index:5;background:rgba(245,245,247,.96);padding:10px 0}.sum{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px}.sum b{font-size:20px}.primary{min-height:46px;border:0;border-radius:12px;background:#111827;color:#fff;padding:0 14px;font-weight:800}.cat{background:#fff;border:1px solid #ddd;border-radius:16px;overflow:hidden;margin:12px 0}.chead{font-weight:800;padding:13px 14px;background:#fafafa}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid #eee}.name{font-weight:700;line-height:1.3;word-break:break-word}.unit{font-size:12px;color:#777;margin-top:3px}.controls{display:flex;align-items:center;gap:6px}.step{width:44px;height:44px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:23px;font-weight:800}.step.plus.on{background:#111827;color:#fff}.qty{width:50px;height:44px;text-align:center;font-size:17px;font-weight:800;border:1px solid #ddd;border-radius:10px;background:#fff;padding:0 2px}.out{background:#fff;border:1px solid #ddd;border-radius:16px;padding:12px;margin-top:16px}textarea{width:100%;min-height:300px;font-size:16px;line-height:1.65;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fafafa}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.note{font-size:12px;color:#666;line-height:1.5}@media(max-width:390px){.wrap{padding-left:8px;padding-right:8px}.row{padding-left:8px;padding-right:8px}.step{width:42px;height:42px}.qty{width:44px}}</style></head><body><div class="wrap"><h1>ぷちグループ 発注</h1><div class="top"><div><label for="date">発注日</label><input id="date" type="date"></div><button class="reset" id="reset" type="button">全リセット</button></div><div class="search"><label for="search">商品検索</label><input id="search" type="search" placeholder="モエ、緑茶、クライナー など"></div><div class="sticky"><div class="sum"><div><span style="font-size:12px;color:#777">選択中</span><br><b><span id="count">0</span>商品</b></div><button class="primary" id="jump" type="button">発注内容を見る</button></div></div><div id="productList"></div><div class="out" id="outbox"><b style="font-size:18px">LINE送信用</b><textarea id="out" readonly></textarea><div class="actions"><button class="primary" id="copy" type="button">コピー</button><button class="sub" id="select" type="button">文章を全選択</button></div><div class="note" id="msg">必要な商品だけLINE文に出ます。</div></div></div><script>
const DATA=[["ソフトドリンク",[["緑茶","本"],["烏龍茶","本"],["ジャスミン茶","本"],["トマトジュース","本"],["オレンジジュース","本"],["コーラ","本"],["ジンジャーエール","本"],["レッドブル","本"],["トニックウォーター","本"],["ネクター","本"],["炭酸水500ml","本"],["クリスタルガイザー","ケース"]]],["割材・サワー系",[["グレープフルーツエード","本"],["業務用ポッカレモン","本"]]],["樽",[["ビール樽","本"],["ハイボール樽","本"],["サワー樽","本"],["酎ハイ樽","本"]]],["焼酎・ウイスキー・リキュール",[["鏡月4L","本"],["JINRO","本"],["ブラックニッカ4L","本"],["響","本"],["知多","本"],["メーカーズマーク","本"],["吉四六","本"],["スミノフ","本"],["カシスリキュール","本"],["梅酒まっこい","本"],["鍛高譚うめ","本"],["ボンベイサファイア","本"],["ヘネシーVSOP","本"],["ウォッカ","本"],["マリブ","本"]]],["シャンパン・ボトル",[["モエ白","本"],["モエネクロゼ","本"],["モエアイスロゼ","本"],["モエネクター","本"],["モエネクターロゼ","本"],["ヴーヴイエロー","本"],["ヴーヴロゼ","本"],["ヴーヴリッチオンアイス","本"],["ベルエポック","本"],["天使のロッソ","本"],["エンジェルブラック","本"],["エンジェルドゥミセックロゼ","本"],["ソウメイ","本"],["ソウメイロゼ","本"],["アルマンドゴールド","本"],["アルマンドロゼ","本"],["ドンペリ","本"],["ドンペリロゼ","本"],["ピーロートブルー","本"]]],["マバム・リステル",[["マバムサンセット","本"],["マバムマジック","本"],["マバムテンテーション","本"],["マバムストロベリー","本"],["マバムブルーベリー","本"],["リステルピーチ","本"],["リステルグリーンアップル","本"]]],["ショット・スピリッツ",[["クエルボゴールド","本"],["テキーラローズ","本"],["タランチュラ","本"],["コカレロ","本"],["テキーラ","本"]]],["クライナー",[["クライナーパイン","ケース"],["クライナーレッドベリー","ケース"],["クライナーココナッツ","ケース"],["クライナーブルーベリー","ケース"],["クライナーアナナスサワー","ケース"],["クライナーココビスケット","ケース"],["クライナーイタリアンアイスティ","ケース"]]],["ぷるりん",[["ぷるりん レモン（12本）","本"],["ぷるりん ライチ（12本）","本"],["ぷるりん 白ぶどう（12本）","本"],["ぷるりん ピーチ（12本）","本"],["ぷるりん パイン（12本）","本"]]],["その他",[["液化炭酸ガス","本"]]]];
const state=new Map(),list=document.getElementById('productList'),search=document.getElementById('search'),date=document.getElementById('date'),count=document.getElementById('count'),out=document.getElementById('out'),msg=document.getElementById('msg');const k=(c,n)=>c+'||'+n,get=(c,n)=>state.get(k(c,n))||0;function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}date.value=today();function render(){const q=search.value.trim().toLowerCase();list.innerHTML='';let selected=0;DATA.forEach(([cat,items])=>{const f=items.filter(([n])=>!q||n.toLowerCase().includes(q)||cat.toLowerCase().includes(q));if(!f.length)return;const sec=document.createElement('section');sec.className='cat';sec.innerHTML='<div class="chead">'+esc(cat)+'</div>';f.forEach(([name,unit])=>{const v=get(cat,name);if(v>0)selected++;const row=document.createElement('div');row.className='row';row.dataset.cat=cat;row.dataset.name=name;row.dataset.unit=unit;row.innerHTML='<div><div class="name">'+esc(name)+'</div><div class="unit">'+(unit==='ケース'?'ケース単位':'数量')+'</div></div><div class="controls"><button class="step minus" type="button">−</button><input class="qty" type="number" inputmode="numeric" min="0" max="99" value="'+v+'"><button class="step plus'+(v>0?' on':'')+'" type="button">＋</button></div>';sec.appendChild(row)});list.appendChild(sec)});count.textContent=selected}function setQty(cat,name,v){v=Math.max(0,Math.min(99,Number(v)||0));v===0?state.delete(k(cat,name)):state.set(k(cat,name),v);render();makeOut()}function fmt(v){if(!v)return'日付未指定';const p=v.split('-');return Number(p[1])+'月'+Number(p[2])+'日'}function makeOut(){const lines=['【'+fmt(date.value)+' 発注】',''];let any=false;DATA.forEach(([cat,items])=>{const chosen=items.filter(([name])=>get(cat,name)>0);if(!chosen.length)return;any=true;lines.push('■'+cat);chosen.forEach(([name,unit])=>lines.push(name+' ×'+get(cat,name)+(unit==='ケース'?'ケース':'')));lines.push('')});if(!any)lines.push('発注商品を選択してください。','');lines.push('以上です。');out.value=lines.join('\n')}list.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const row=btn.closest('.row');if(!row)return;const cat=row.dataset.cat,name=row.dataset.name,current=get(cat,name);if(btn.classList.contains('plus'))setQty(cat,name,current+1);if(btn.classList.contains('minus'))setQty(cat,name,current-1)});list.addEventListener('change',e=>{if(!e.target.classList.contains('qty'))return;const row=e.target.closest('.row');setQty(row.dataset.cat,row.dataset.name,e.target.value)});search.addEventListener('input',render);date.addEventListener('change',makeOut);document.getElementById('reset').addEventListener('click',()=>{state.clear();search.value='';render();makeOut()});document.getElementById('jump').addEventListener('click',()=>document.getElementById('outbox').scrollIntoView({behavior:'smooth',block:'start'}));document.getElementById('select').addEventListener('click',()=>{out.focus();out.select();out.setSelectionRange(0,out.value.length)});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(out.value);msg.textContent='コピーしました。LINEに貼り付けてください。'}catch(e){out.focus();out.select();out.setSelectionRange(0,out.value.length);msg.textContent='文章を選択しました。スマホの「コピー」を押してください。'}});render();makeOut();
</script></body></html>
